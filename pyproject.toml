[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="taller-mlops"
version="1.0.0"
description="Estimación de reparaciones y ciclo de vida de modelos con datos sintéticos"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn>=0.30,<1","pandas==2.3.3","numpy==2.5.4","scikit-learn==1.9.1","xgboost==3.4.1","lightgbm==4.7.0","shap==0.54.1","joblib>=1.4,<2","filelock>=3,<4","httpx>=0.28,<1","prometheus-client>=0.21,<1"]
[project.optional-dependencies]
training=["mlflow==3.18.0","evidently==0.7.23","pyarrow==26.0.1"]
test=["pytest>=8","ruff>=0.17,<1"]
[tool.hatch.build.targets.wheel]
packages=["taller","pipelines","monitoring"]
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope="function"
testpaths=["tests"]
