name: Validate model lifecycle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests-and-training:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra training --extra test --frozen
      - run: uv run pytest -q --junitxml=test-results.xml
      - run: uv run python -m pipelines.generate --folder /tmp/taller-data --count 5000
      - run: uv run python -m pipelines.train --data /tmp/taller-data --artifacts /tmp/taller-artifacts --quick
      - run: docker build --target serving -t taller-mlops:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            test-results.xml
            /tmp/taller-artifacts/latest-training.json
