services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: local-airflow-only
      POSTGRES_DB: airflow
    volumes: ["metadata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 3s
      retries: 20
  airflow:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:local-airflow-only@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'demo:admin'
      AIRFLOW__API__WORKERS: '1'
      AIRFLOW__CORE__PARALLELISM: '2'
    ports: ["127.0.0.1:5116:8080"]
    volumes: ["airflow_home:/opt/airflow", "shared:/shared"]
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone
    mem_limit: 3g
volumes:
  metadata:
  airflow_home:
  shared:
