apiVersion: v1
kind: Namespace
metadata:
  name: taller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: champion
  namespace: taller
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: champion}
  template:
    metadata:
      labels: {app: champion}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: taller-mlops:demo
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          lifecycle:
            preStop:
              exec:
                command: [python, -c, 'import time; time.sleep(5)']
          env:
            - {name: MODEL_VERSION, value: 20261115T222229_07061fb7}
          resources:
            requests: {memory: 350Mi, cpu: 100m}
            limits: {memory: 700Mi, cpu: '1'}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 8
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: champion, namespace: taller}
spec:
  selector: {app: champion}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: challenger, namespace: taller}
spec:
  replicas: 1
  selector:
    matchLabels: {app: challenger}
  template:
    metadata:
      labels: {app: challenger}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: taller-mlops:demo
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          lifecycle:
            preStop:
              exec:
                command: [python, -c, 'import time; time.sleep(5)']
          env:
            - {name: MODEL_VERSION, value: 20261115T222848_1f945185}
          resources:
            requests: {memory: 350Mi, cpu: 100m}
            limits: {memory: 700Mi, cpu: '1'}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 8
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: challenger, namespace: taller}
spec:
  selector: {app: challenger}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: router, namespace: taller}
spec:
  replicas: 1
  selector:
    matchLabels: {app: router}
  template:
    metadata:
      labels: {app: router}
    spec:
      containers:
        - name: router
          image: taller-mlops:demo
          imagePullPolicy: IfNotPresent
          command: [uvicorn, taller.router:app, --host, 0.0.0.0, --port, '8000']
          ports: [{containerPort: 8000}]
          env:
            - {name: CHALLENGER_PERCENT, value: '10'}
          resources:
            requests: {memory: 80Mi, cpu: 50m}
            limits: {memory: 200Mi, cpu: '1'}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: router, namespace: taller}
spec:
  type: NodePort
  selector: {app: router}
  ports: [{port: 8000, targetPort: 8000, nodePort: 31085}]
